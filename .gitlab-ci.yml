stages:
  - build
  - test
  - prod

variables:
  ENV_TEMPLATE: .env.template
  ENV_OUTPUT: .env
  COMPOSE_PROJECT_NAME: "${CI_PROJECT_NAME}_${CI_PROJECT_ID}"
  NGINX_CONF: "${CI_PROJECT_DIR}/nginx/conf.d/django.conf"

.deploy-job:
  before_script:
    - sed -i "s/_DB_NAME_/${DB_NAME}/g" ${ENV_TEMPLATE}
    - sed -i "s/_DB_USER_/${DB_USER}/g" ${ENV_TEMPLATE}
    - sed -i "s/_DB_PASS_/${DB_PASS}/g" ${ENV_TEMPLATE}
    - sed -i "s/_DJANGO_ADMIN_/${DJANGO_ADMIN}/g" ${ENV_TEMPLATE}
    - sed -i "s/_DJANGO_PASS_/${DJANGO_PASS}/g" ${ENV_TEMPLATE}
    - sed -i "s/_DJANGO_KEY_/${DJANGO_KEY}/g" ${ENV_TEMPLATE}
    - mv ${ENV_TEMPLATE} ${ENV_OUTPUT}
    - echo "${REGISTRY_TOKEN}" | docker login -u "${REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker-compose pull
  script:
    - |
      if docker-compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.yaml ps --services | grep -q '[a-zA-Z0-9]'; then
      docker-compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.yaml down --volumes --remove-orphans 
      fi
      docker-compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.yaml up -d

build_job:
  stage: build
  script:
    - docker-compose build
    - docker-compose push
  tags:
    - bt-srv

test_job:
  extends: .deploy-job
  before_script:
    - sed -i "s/_DOMAIN_NAME_/test-academhub.ru/g" "${NGINX_CONF}"
    - !reference [.deploy-job, before_script]
  stage: test
  tags:
    - bt-srv

prod_job:
  extends: .deploy-job
  before_script:
    - sed -i "s/_DOMAIN_NAME_/academhub.ru/g" "${NGINX_CONF}"
    - !reference [.deploy-job, before_script]
  stage: test
  tags:
    - academhub-prod
  when: manual