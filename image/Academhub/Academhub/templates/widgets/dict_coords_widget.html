<div class="excel-range-widget dict">
    <input type="hidden" name="{{ widget.name }}" value="{{ widget.json_value|safe }}" id="id_{{ widget.name }}">
    
    <div class="excel-range-container-dict">
        <div class="excel-ranges">
            <!-- Постоянное поле без кнопки удаления -->
            <div class="excel-range-item">
                <input type="text" class="sheet-input" placeholder="Лист" value="{% if widget.value %}{{ widget.value.0.sheet|default:'' }}{% endif %}">
                <input type="text" class="cell-input" placeholder="B20" 
                       pattern="^[A-Za-z]{1,3}\d+(?::[A-Za-z]{1,3}\d+)?$"
                       title="Допустимый формат: B20 или N4:P8" value="{% if widget.value %}{{ widget.value.0.cell|default:'' }}{% endif %}">
            </div>
            
            <!-- Дополнительные поля с кнопкой удаления -->
            {% for item in widget.value|slice:"1:" %}
            <div class="excel-range-item">
                <input type="text" class="sheet-input" placeholder="Лист" value="{{ item.sheet|default:'' }}">
                <input type="text" class="cell-input" placeholder="B20" 
                       pattern="^[A-Za-z]{1,3}\d+(?::[A-Za-z]{1,3}\d+)?$"
                       title="Допустимый формат: B20 или N4:P8" value="{{ item.cell|default:'' }}">
                <button type="button" class="remove-range-btn" title="Удалить">
                    <svg class="delete-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <path d="M5 6v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"></path>
                        <path d="M10 11v6"></path>
                        <path d="M14 11v6"></path>
                    </svg>
                </button>
            </div>
            {% endfor %}
        </div>
        
        <button type="button" class="add-excel-range-btn" title="Добавить ячейку">
            <span class="plus-icon">+</span>
        </button>
    </div>
</div>

<style>
.excel-range-widget.dict {
    width: 100%;
    font-family: Arial, sans-serif;
    text-align: left;
}

.excel-range-container-dict {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.add-excel-range-btn {
    width: 40px;
    height: 40px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
}

.add-excel-range-btn:hover {
    background-color: #45a049;
    transform: scale(1.1);
}

.add-excel-range-btn .plus-icon {
    font-size: 24px;
    font-weight: bold;
}

.excel-ranges {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.excel-range-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.sheet-input, .cell-input {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    max-width: 200px;
}

.sheet-input:focus, .cell-input:focus {
    outline: none;
    border-color: #4CAF50;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

.remove-range-btn {
    background-color: #ff4444;
    border: none;
    border-radius: 4px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.3s;
}

.remove-range-btn:hover {
    background-color: #cc0000;
}

.delete-icon {
    width: 20px;
    height: 20px;
    stroke: white;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.excel-range-widget.dict').forEach(widget => {
        const hiddenInput = widget.querySelector('input[type="hidden"]');
        const rangesContainer = widget.querySelector('.excel-ranges');
        const addButton = widget.querySelector('.add-excel-range-btn');
        const permanentRangeItem = rangesContainer.querySelector('.excel-range-item');
        
        // Добавление новой ячейки
        function addRange(cell = '', sheet = '') {
            const rangeId = Date.now();
            const rangeHtml = `
                <div class="excel-range-item" data-id="${rangeId}">
                    <input type="text" class="sheet-input" placeholder="Лист" value="${sheet}">
                    <input type="text" class="cell-input" placeholder="B20" 
                           pattern="^[A-Za-z]{1,3}\\d+(?::[A-Za-z]{1,3}\\d+)?$"
                           title="Допустимый формат: B20 или N4:P8" value="${cell}">
                    <button type="button" class="remove-range-btn" title="Удалить">
                        <svg class="delete-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <path d="M5 6v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </button>
                </div>
            `;
            rangesContainer.insertAdjacentHTML('beforeend', rangeHtml);
            
            const newRange = rangesContainer.querySelector(`[data-id="${rangeId}"]`);
            const removeButton = newRange.querySelector('.remove-range-btn');
            removeButton.addEventListener('click', () => {
                newRange.remove();
                updateHiddenInput();
            });
            
            newRange.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateHiddenInput);
            });
        }
        
        // Обновление скрытого поля
        function updateHiddenInput() {
            const ranges = [];
            widget.querySelectorAll('.excel-range-item').forEach(item => {
                const sheet = item.querySelector('.sheet-input').value.trim();
                const cell = item.querySelector('.cell-input').value.trim();
                
                if (sheet && cell) {
                    ranges.push({
                        cell: cell,
                        sheet: sheet
                    });
                }
            });
            
            hiddenInput.value = JSON.stringify(ranges);
        }
        
        // Инициализация существующих значений
        try {
            const initialData = JSON.parse(hiddenInput.value);
            rangesContainer.innerHTML = ''; // Очищаем контейнер
            
            // Добавляем постоянное поле
            const firstItem = initialData.length > 0 ? initialData[0] : {cell: '', sheet: ''};
            rangesContainer.insertAdjacentHTML('beforeend', `
                <div class="excel-range-item">
                    <input type="text" class="sheet-input" placeholder="Лист" value="${firstItem.sheet}">
                    <input type="text" class="cell-input" placeholder="B20" 
                           pattern="^[A-Za-z]{1,3}\\d+(?::[A-Za-z]{1,3}\\d+)?$"
                           title="Допустимый формат: B20 или N4:P8" value="${firstItem.cell}">
                </div>
            `);
            
            // Добавляем дополнительные элементы
            initialData.slice(1).forEach(item => addRange(item.cell, item.sheet));
            
            // Привязываем обработчики к постоянному полю
            permanentRangeItem.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateHiddenInput);
            });
        } catch (e) {
            console.error('Ошибка при разборе начальных данных:', e);
            rangesContainer.innerHTML = `
                <div class="excel-range-item">
                    <input type="text" class="sheet-input" placeholder="Лист" value="">
                    <input type="text" class="cell-input" placeholder="B20" 
                           pattern="^[A-Za-z]{1,3}\\d+(?::[A-Za-z]{1,3}\\d+)?$"
                           title="Допустимый формат: B20 или N4:P8" value="">
                </div>
            `;
            rangesContainer.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateHiddenInput);
            });
        }
        
        // Удаляем существующие обработчики
        const newAddButton = addButton.cloneNode(true);
        addButton.parentNode.replaceChild(newAddButton, addButton);
        
        // Обработчик кнопки добавления
        newAddButton.addEventListener('click', () => {
            addRange();
        });
    });
});
</script>
