{% extends 'base.html' %}
{% load static %}


{% block content %}
    <link rel="stylesheet" href="{% static 'css/create_release.css' %}">

    <h1>Выбор параметров</h1>
    <div class="form-container">
        <div id="selectionForm">
            <div class="form-group">
                <label for="qualifications">Квалификации:</label>
                <select id="qualifications" name="qualifications" required>
                    <option value="">-- Выберите квалификацию --</option>
                    {% for qualification in qualifications %}
                    <option value="{{ qualification.id }}" class="theme-text">{{ qualification.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="curriculum">Учебный план:</label>
                <select disabled id="curriculum" name="curriculum" required>
                    <option value="">-- Сначала выберете квалификацию --</option>
                </select>
            </div>


            <div class="form-group">
                <label for="courses">Курс:</label>
                <select disabled id="courses" name="courses" required>
                    <option value="">-- Сначала выберете учебный план --</option>
                </select>
            </div>


            <div class="form-group">
                <button id="createButton">Создать</button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/releases_from_curriculums/create_release.js' %}"></script>
{% endblock %}
