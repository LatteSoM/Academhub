{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid theme-surface p-4 rounded-lg shadow">
    <div class="d-flex gap-4 flex-column flex-lg-row">
        <!-- Левая колонка -->
        <div class="flex-grow-1">
            <div class="mb-4">
                <div class="d-flex flex-column gap-2">
                    <select class="form-select theme-input" id="specialty">
                        <option selected>Выберите специальность</option>
                        {% for specialty in specialties %}
                        <option value="{{ specialty.id }}">{{ specialty.name }}</option>
                        {% endfor %}
                    </select>

                    <select class="form-select theme-input" id="study_plan" disabled>
                        <option selected>Сначала выберите специальность</option>
                    </select>

                    <select class="form-select theme-input" id="course" disabled>
                        <option selected>Сначала выберите учебный план</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <div class="theme-surface rounded border border-var p-3" style="height: 300px;">
                    <div id="groups" class="h-100 overflow-y-auto pe-2">
                        <!-- Groups content -->
                    </div>
                </div>
            </div>

            <form method="post" action="{% url 'import_teachers_excel' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label theme-text">Импорт преподавателей из Excel:</label>
                    <div class="input-group">
                        <input class="form-control theme-input" type="file" id="excel_file_import" name="excel_file" accept=".xlsx, .xls" required>
                        <button type="submit" class="btn btn-primary">
                            <i class="material-icons">upload</i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Правая колонка -->
        <div class="flex-grow-2" style="min-width: 60%;">
            <div class="mb-4">
                <div class="d-flex align-items-center gap-3">
                    <span class="theme-text">Выбор семестра:</span>
                    <select class="form-select theme-input w-auto" id="termSelect">
                        <option selected>1</option>
                        <option>2</option>
                    </select>
                </div>
            </div>

            <div class="custom-table-container theme-surface">
                <table class="desktop-table w-100">
                    <thead class="theme-bg sticky-top">
                        <tr>
                            <th width="30%">Код Дисциплины</th>
                            <th width="30%">Дисциплина</th>
                            <th width="40%">Преподаватели</th>
                            <th width="30%">Выбор преподавателя</th>
                        </tr>
                    </thead>
                    <tbody id="disciplines-body" class="theme-text">
                        <!-- Table content -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex gap-3 mt-4">
                <button class="btn btn-success flex-grow-1">Сохранить преподавателей</button>
                <button class="btn btn-warning flex-grow-1">Сохранить период аттестации</button>
                <button class="btn btn-info flex-grow-1">Проверить комплектность</button>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-table-container {
        height: 400px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
    }

    .desktop-table th {
        background-color: var(--surface-color);
        padding: 1rem;
        border-bottom: 2px solid var(--border-color);
    }

    .desktop-table td {
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border-color);
        background-color: var(--surface-color) !important;
    }

    #groups::-webkit-scrollbar {
        width: 6px;
    }

    #groups::-webkit-scrollbar-thumb {
        background-color: var(--border-color);
        border-radius: 4px;
    }

    .form-select {
        background-color: var(--secondary-color);
        border: 1px solid var(--border-color);
        color: var(--text-color);
    }

    @media (max-width: 992px) {
        .container-fluid {
            padding: 1rem !important;
        }

        .d-flex.flex-column.flex-lg-row {
            gap: 2rem !important;
        }
    }
</style>

<script src="{% static 'js/complete_set/view.js' %}"></script>
{% endblock %}
