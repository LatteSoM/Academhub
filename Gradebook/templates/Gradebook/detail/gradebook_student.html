{% extends 'base_detail.html' %}

{% load django_tables2 %}
{% load util %}

{% block extra_css %}
    {{ block.super }}
    <style>
        .custom-red-btn {
        background-color: #dc3545; /* Красный цвет */
        color: white; /* Белый текст */
        border: none; /* Убираем границу */
        padding: 10px 20px; /* Отступы */
        border-radius: 5px; /* Закругленные углы */
        text-decoration: none; /* Убираем подчеркивание */
        cursor: pointer; /* Курсор в виде указателя */
    }

    .custom-red-btn:hover {
        background-color: #c82333; /* Темнее красный при наведении */
    }
    </style>
{% endblock %}

{% block detail-header %}
<h1>
    {{object}}
</h1>
{% endblock %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const links = document.querySelectorAll('a[href*="download_report"]');
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const url = this.href;
            fetch(url)
                .then(response => {
                    const refreshUrl = response.headers.get('X-Refresh-After');
                    return response.blob().then(blob => ({ blob, refreshUrl }));
                })
                .then(({ blob, refreshUrl }) => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = '';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(blobUrl);
                    if (refreshUrl) {
                        window.location.href = refreshUrl;
                    }
                });
        });
    });
});
</script>
